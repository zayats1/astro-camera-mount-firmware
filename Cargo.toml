[package]
edition = "2024"
name = "astro-camera-mount-firmware"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = "0.7.10"
cortex-m-rt = "0.7.7"
embedded-hal = { version = "1.0.0" }

defmt = "1.2.0"
defmt-rtt = "1.3"
# panic-probe = { version = "0.3", features = ["print-defmt"] }

rp2040-hal = { version = "0.12.0", features = [
    "rtic-monotonic",
    "rt",
    "chrono",
    "critical-section-impl",
    "rom-func-cache",
    "defmt",
] }

rp2040-boot2 = "0.3.0"
critical-section = "1.2.0"
embedded-hal-nb = "1.0.0"
heapless = "0.9.3"
panic-halt = "1.0.0"
rtic-sync = "1.6.0"
function_name = "0.3.0"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }

# If you're not going to use a Board Support Package you'll need these:
# rp2040-hal = { version="0.10", features=["rt", "critical-section-impl"] }
# rp2040-boot2 = "0.3"

[dependencies.rtic]
version = "2.4.0"
features = ["thumbv6-backend"]

[dependencies.rtic-monotonics]
version = "3.0.0"
features = ["rp2040"]


# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
